.tab:hover{background:var(--bg3);color:var(--text2)}.tab.on{background:var(--accent);color:#fff}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card.w{background:rgba(234,179,8,0.06);border-color:rgba(234,179,8,0.2)}
.card.g{background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.2)}
.ct{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px}
.day{background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dn{font-size:13px;font-weight:700}
.dnote{font-size:10px;color:var(--text3);font-style:italic}
.sess{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.sess:last-child{margin-bottom:0}
.st{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tr{background:rgba(239,68,68,0.15);color:var(--red)}
.ts{background:rgba(168,85,247,0.15);color:var(--purple)}

.te{background:rgba(59,130,246,0.15);color:var(--blue)}
.tc{background:rgba(99,102,241,0.15);color:#818cf8}
.sb{flex:1;min-width:0}
.sd{font-size:12px;color:var(--text)}
.sp{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.sp span{font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.sl{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3)}
.sv{font-size:18px;font-weight:700;color:var(--text);margin-top:2px}
.ss{font-size:10px;color:var(--text3);margin-top:1px}
.zb{display:flex;border-radius:4px;overflow:hidden;height:10px}
.zl{display:flex;gap:10px;margin-top:6px}
.zl span{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text3)}
.zd{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:inline-block}
.cw{position:relative;height:200px;margin:8px 0}
.pr{margin-bottom:14px}.prh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.prl{font-size:12px;color:var(--text2);font-family:'JetBrains Mono',monospace}
.prv{font-size:13px;font-weight:700;color:var(--text)}
.prb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}

.mi{font-size:12px;margin-top:2px;flex-shrink:0}

.tbl{width:100%;font-size:11px;border-collapse:collapse}

.ctx{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}

.phase-desc{font-size:12px;color:var(--text2);line-height:1.6;padding:10px;background:rgba(15,23,42,0.4);border-radius:8px;margin-bottom:12px}
footer{text-align:center;font-size:10px;color:var(--text3);margin-top:24px;padding-bottom:20px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;margin-top:1px;-webkit-tap-highlight-color:transparent}
.chk:hover{border-color:var(--text3)}
.chk.done{border-color:var(--green);background:var(--green)}
.chk.done::after{content:'\2713';color:#fff;font-size:12px;font-weight:700}
.refresh-btn{background:none;border:1px solid var(--bg3);border-radius:6px;color:var(--text3);font-size:11px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s;font-family:'DM Sans',sans-serif}
.refresh-btn:hover{border-color:var(--text2);color:var(--text2)}
.refresh-btn svg{width:12px;height:12px}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 20px rgba(59,130,246,0.1)}
.day-date{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-left:6px;font-weight:400}
.day-count{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;background:var(--bg3);padding:1px 6px;border-radius:10px}
.day-count.alldone{background:rgba(34,197,94,0.2);color:var(--green)}
.week-dots{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:16px;padding:10px;background:var(--bg2);border-radius:10px;border:1px solid var(--border)}
.week-dot{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.week-dot-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg3);display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .3s}
.week-dot-circle.partial{border-color:var(--accent);background:rgba(59,130,246,0.15)}
.week-dot-circle.complete{border-color:var(--green);background:var(--green);color:#fff;font-weight:700}
.week-dot-circle.is-today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.week-dot-label{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.rv{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.rv-icon{font-size:14px;flex-shrink:0}
.rv-text{font-size:12px;color:var(--text2)}
.rv-val{font-size:12px;font-weight:600}
.rv-good{color:var(--green)}.rv-ok{color:var(--yellow)}.rv-miss{color:var(--red)}
</style>
</head>

// Checkmark persistence
var checkKey='checks-w'+currentWeek;
function getChecks(){try{return JSON.parse(localStorage.getItem(checkKey))||{};}catch(e){return {};}}
function toggleCheck(id){var c=getChecks();if(c[id])delete c[id];else c[id]=1;localStorage.setItem(checkKey,JSON.stringify(c));render();}
function isChecked(id){return !!getChecks()[id];}
function chk(id){return '<div class="chk'+(isChecked(id)?' done':'')+'" onclick="toggleCheck(\''+id+'\')"></div>';}
function getDayCheckedCount(dayIdx){var d=DAYS[dayIdx];var c=getChecks();var n=0;for(var i=0;i<d.ids.length;i++){if(c[d.ids[i]])n++;}return n;}
function getTodayIdx(){var dow=new Date().getDay();if(dow===0)return 6;return dow-1;}

function weekDots(){
  var checks=getChecks();var todayIdx=getTodayIdx();
  var h='<div class="week-dots">';var sn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  for(var i=0;i<7;i++){var d=DAYS[i];var done=getDayCheckedCount(i);var total=d.ids.length;
    var cls='week-dot-circle';if(done>=total&&total>0)cls+=' complete';else if(done>0)cls+=' partial';if(i===todayIdx)cls+=' is-today';
    h+='<div class="week-dot"><div class="'+cls+'">'+(done>=total&&total>0?'\u2713':(done>0?done:''))+'</div><span class="week-dot-label">'+sn[i]+'</span></div>';}
  return h+'</div>';
}

function sess(id,tag,label,desc,params){
  var h='<div class="sess">'+chk(id)+'<span class="st '+tag+'">'+label+'</span><div class="sb"><span class="sd">'+desc+'</span>';
  if(params){h+='<div class="sp">';for(var i=0;i<params.length;i++)h+='<span>'+params[i]+'</span>';h+='</div>';}
  return h+'</div></div>';
}

function dayOpen(idx){
  var d=DAYS[idx];var todayIdx=getTodayIdx();var isToday=idx===todayIdx;
  var done=getDayCheckedCount(idx);var total=d.ids.length;
  var countCls='day-count'+(done>=total&&total>0?' alldone':'');
  var h='<div class="day'+(isToday?' today':'')+'">';
  h+='<div class="dh"><div style="display:flex;align-items:baseline"><span class="dn" style="color:'+d.color+'">'+d.name+'</span><span class="day-date">'+d.date+'</span></div>';
  h+='<div style="display:flex;align-items:center;gap:6px">';
  if(done>0)h+='<span class="'+countCls+'">'+done+'/'+total+'</span>';
  if(d.note)h+='<span class="dnote">'+d.note+'</span>';
  h+='</div></div>';return h;
}

function zb(z){if(!z)return'';var h='<div class="zb">';for(var i=0;i<z.length;i++){if(z[i]>0)h+='<div style="width:'+z[i]+'%;background:'+ZC[i]+'"></div>';}return h+'</div>';}

function renderProfile(){
  var h='<div class="card"><div class="ct">Running Baseline (Updated May 11)</div><div class="stats">';
  var stats=[{l:"Running LTHR",v:B.lthr+" bpm",s:"Garmin Feb 24 \u00b7 working value"},{l:"Max HR",v:B.maxHr+" bpm",s:"Observed Mar 18"},{l:"Resting HR",v:B.restHr+" bpm",s:"May 10 \u00b7 up from 42"},{l:"VO2max",v:""+B.vo2max,s:"Garmin estimate \u00b75%"},{l:"VDOT",v:"~"+B.vdot,s:"From 5K: 26:26"},{l:"Best 5K",v:B.best5k,s:"Mar 18 (PR)"},{l:"LT Pace",v:B.ltPace+"/km",s:"Mar 18 fastest 5K"},{l:"Easy Pace",v:"~6:00\u20136:15",s:"HR &lt;148 bpm"}];
  for(var i=0;i<stats.length;i++){var s=stats[i];h+='<div><div class="sl">'+s.l+'</div><div class="sv">'+s.v+'</div>';if(s.s)h+='<div class="ss">'+s.s+'</div>';h+='</div>';}
  h+='</div></div>';

  h+='<div class="card"><div class="ct">Understanding VO2max vs VDOT</div>';
  h+='<p style="font-size:12px;color:var(--text2)">Garmin estimates VO2max at 50.9 (from all activities including cycling and snowshoeing). Your 5K time of 26:26 gives a VDOT of ~36. These are different metrics \u2014 VDOT is a performance index that assumes elite-level running economy (Daniels), while Garmin VO2max is estimated from HR-to-pace ratios across activities. A difference between them is normal and does not necessarily indicate a "gap" to close. What we do know: you have strong cardiovascular fitness from multi-sport training, and more running volume should improve running-specific economy and performance.</p></div>';

  h+='<div class="card"><div class="ct">Friel HR Zones (Working LTHR '+B.lthr+')</div>';
  h+='<p style="font-size:10px;color:var(--text3);margin-bottom:8px">Running only. Cycling LTHR typically 5\u201310 bpm lower. Garmin auto-detected 169 on Mar 16 but auto-detect fluctuates \u2014 keeping 174 until 30-min field test (end of Phase 3).</p>';
  for(var i=0;i<B.zones.length;i++){var z=B.zones[i];h+='<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px"><span class="zd" style="background:'+z.c+'"></span><span style="color:var(--text2);flex:1">'+z.n+'</span><span class="m" style="color:var(--text)">'+(z.lo>0?z.lo:'&lt;')+(z.lo>0?'\u2013':'')+z.hi+'</span></div>';}
  h+='</div>';

  h+='<div class="card"><div class="ct">Training Paces \u2014 HR-Calibrated (VDOT '+B.vdot+')</div>';
  h+='<p style="font-size:10px;color:var(--text3);margin-bottom:8px">Paces calibrated to Friel HR zones, not raw Daniels tables. Your VO2max (50.3) from multi-sport training means Daniels table paces produce sub-target HR. These paces hit the correct HR zones for each intensity. In cold/wind/snow: HR overrides pace.</p>';
  var pr=[{z:"Easy",p:B.paces.E,hr:"&lt;148 bpm",d:"Conversational. Daniels table: ~6:30\u20137:10/km. Actual: 6:03/km @ HR 137 (Z1)."},{z:"Threshold",p:B.paces.T,hr:"165\u2013172",d:"Comfortably hard. Daniels table: ~5:33/km. HR-calibrated faster to reach Z4."},{z:"Interval",p:B.paces.I,hr:"174\u2013184",d:"3\u20135min hard reps. Daniels table: ~5:05/km. Not prescribed yet."},{z:"Repetition",p:B.paces.R,hr:"pace only",d:"200\u2013400m speed work. Daniels table: ~4:48/km. Not prescribed yet."}];
  for(var i=0;i<pr.length;i++){var r=pr[i];h+='<div class="pc"><div class="pcr"><span style="font-size:13px;font-weight:600;color:var(--text)">'+r.z+'</span><span class="m" style="font-size:13px;font-weight:700;color:var(--text)">'+r.p+'/km</span></div><div style="display:flex;justify-content:space-between;margin-top:2px"><span style="font-size:10px;color:var(--text3)">'+r.d+'</span><span class="m" style="font-size:10px;color:var(--blue)">'+r.hr+'</span></div></div>';}
  h+='<div class="hi">Why paces differ from Daniels tables: Your VO2max (50.3) from multi-sport training exceeds your VDOT (36, running-only performance). At Daniels table paces, your HR stays well below target zones because your cardiovascular engine is oversized relative to running economy. All paces are calibrated to Friel HR zones instead. HR always governs pace. In Troms\u00f8 winter conditions, this may be 6:15\u20136:30/km for easy.</div>';
  h+='</div>';
  return h;
}

// ═══════════ METHODS ═══════════
function renderMethods(){
  var secs=[
    {t:"Sources &amp; Framework",c:"This plan draws from multiple evidence-based systems:\n\n\u2022 Seiler polarized model \u2014 intensity distribution in endurance athletes (Seiler 2010; St\u00f6ggl &amp; Sperlich 2014). Seiler observed ~80/20 distribution by session count in elite athletes training 10\u201313 sessions/week. By time, this equates to ~90% easy / 10% hard because easy sessions are longer. Caveat: this data comes from high-volume athletes; evidence for 2\u20133 sessions/week is limited (Munoz et al. 2014 showed benefit in recreational runners).\n\n\u2022 Daniels Running Formula (4th ed.) \u2014 VDOT and performance-based training pace categories. VDOT 36 from 5K: 26:26. Training paces are HR-calibrated (see below), not raw Daniels table paces, because VO2max/VDOT discrepancy means table paces produce sub-target HR. Volume increase follows the commonly used 10% guideline (attributed to Ullyot/Henderson, not Daniels). Daniels recommends adding miles equal to weekly session count, then holding 3\u20134 weeks.\n\n\u2022 Friel HR zones \u2014 7-zone system anchored to running LTHR (Training Bible). Zones are running-specific; other sports have different thresholds. Working LTHR: 174 (Garmin Feb 24). Garmin re-detected 169 on Mar 16 but auto-detect fluctuates \u2014 keeping 174 until 30-min field test.\n\n\u2022 Concurrent training \u2014 the interference effect is limb-specific: upper body strength training has near-zero interference with running (established in post-Hickson research). Hickson (1980) demonstrated the interference effect for combined strength + endurance but did not isolate upper vs lower body. Wilson et al. (2012) meta-analysis found running causes more interference than cycling and higher frequency worsens it. Schumann et al. (2014) studied intra-session exercise order, finding order doesn\u2019t significantly affect outcomes. Lower body spacing (48hrs from hard running) is standard coaching practice."},
    {t:"Why Paces Differ from Daniels Tables",c:"All training paces are calibrated to Friel HR zones, not raw Daniels VDOT tables. Here\u2019s why:\n\nYour VO2max (50.3) from multi-sport training (cycling, snowshoeing, strength) far exceeds your VDOT (36, running-only performance). This means your cardiovascular engine is oversized relative to your running economy. At Daniels table paces, your HR stays well below target zones \u2014 the training stimulus would be insufficient.\n\nDaniels VDOT 36 table paces vs HR-calibrated paces used here:\n\u2022 Easy: Table ~6:30\u20137:10/km \u2192 Used 6:00\u20136:15/km (produces HR 137, Z1 \u2014 confirmed Week 1)\n\u2022 Threshold: Table ~5:33/km \u2192 Used 5:10\u20135:20/km (to reach Z4: HR 165\u2013172)\n\u2022 Interval: Table ~5:05/km \u2192 Used 4:45\u20134:55/km (to reach Z5a: HR 174\u2013184)\n\u2022 Repetition: Table ~4:48/km \u2192 Used ~4:20/km (pace-governed speed work)\n\nAs running economy improves, VDOT will rise and table paces will converge with HR-calibrated paces. Until then, HR governs all intensity targets.\n\nNote: VDOT (36) and Garmin VO2max (50.3) are different metrics. VDOT is a performance index assuming average running economy (Daniels). Garmin VO2max is estimated from HR/pace across all activities. A difference is normal.\n\nRule: HR governs pace. In Troms\u00f8 winter conditions (cold, ice, snow), expect paces 10\u201320s/km slower at same HR."},
    {t:"Garmin Metric Reliability",c:"Not all Garmin metrics are equally reliable. During a base-building phase (more easy running, less hard running), some stats will drop even though actual fitness is improving.\n\nReliable signals (measured during sleep, not affected by workout type):\n\u2022 HRV trend \u2014 stable or improving = good recovery\n\u2022 Resting HR trend \u2014 stable or decreasing = good adaptation\n\u2022 HR at a given easy pace over time \u2014 if you run 6:00/km and HR drops from 137 to 132 over weeks, that is real cardiac adaptation\n\u2022 5K time when actually tested \u2014 the only ground truth for running performance\n\nUnreliable during base building (will fluctuate or drop):\n\u2022 Garmin VO2max estimate \u2014 algorithm penalizes slow running. Easy runs produce lower pace-to-HR ratio, which Garmin reads as reduced fitness. This is an algorithm artifact, not real fitness loss.\n\u2022 LTHR auto-detect \u2014 fluctuates based on run type, HR sensor quality, and which algorithm version Garmin uses. A single auto-detect reading should not trigger zone changes. Only a 30-min field test validates LTHR.\n\u2022 Training Status \u2014 reacts to VO2max trend. If VO2max drops (from easy running), status may flip to Maintaining or Unproductive even during correct training.\n\u2022 Race Predictions \u2014 derived from VO2max, so they move with it.\n\nExpect: Garmin stats may get worse before they get better during this 8-week block. This is normal and documented in Garmin user communities. The training prescriptions (paces, durations, progression) do not depend on these stats \u2014 they come from Daniels/Seiler methodology based on your actual 5K time."},
    {t:"How Training Load Is Tracked",c:"Previous versions used unified hrTSS across all sports. This was incorrect.\n\nCorrected approach:\n\u2022 Running: weekly distance (km) + time distribution (easy vs threshold)\n\u2022 Strength: session count and consistency (not HR-based)\n\u2022 Long endurance: duration + average HR zone\n\u2022 Walks/yoga: not tracked as training load\n\nFatigue decisions use Garmin Training Readiness + sleep quality + HRV status as primary signals, not calendar-based recovery cycles.\n\nNote: Training Readiness and HRV are the most reliable Garmin fatigue signals because they are measured during sleep, not during exercise."},
    {t:"Concurrent Training Scheduling",c:"The interference effect is limb-specific (post-Hickson research). Practical application:\n\n\u2022 Arms, chest, core \u2192 near-zero interference with running. No scheduling constraint.\n\u2022 Legs (deadlift, squat) \u2192 48hrs from hard running (standard coaching practice).\n\nKey research:\n\u2022 Hickson (1980): Showed combined strength + endurance training attenuated leg strength gains after week 7. Did NOT isolate upper vs lower body.\n\u2022 Wilson et al. (2012): Meta-analysis found running causes more interference than cycling; higher endurance frequency worsens strength outcomes. The 48hr spacing recommendation is coaching convention, not a specific finding from this paper.\n\u2022 Schumann et al. (2014): Studied exercise ORDER within a session (strength-first vs endurance-first). Found order doesn\u2019t significantly affect outcomes over 24 weeks. Not about inter-day spacing.\n\nSchedule: Fri legs \u2192 Sat easy endurance \u2192 Sun light/easy run \u2192 Mon easy run = 72hrs between legs and next significant running load.\n\nAt current running volume (~2\u20133\u00d7/week, 13\u201324km), interference is minimal."},
    {t:"Weekly Update Process",c:"Each week: say \"update\". Then:\n\n1. Pull all Garmin data (activities, LTHR, VO2max, training status, readiness, HRV, resting HR, race predictions) + Strava cross-reference\n2. Process: filter to current week, extract stats per activity, correct Garmin misclassifications (e.g. mobility auto-tagged as deadlift)\n3. Compare actual vs planned day-by-day, deep dive on running + endurance\n4. Report Garmin stats but flag which are reliable vs which fluctuate during base building\n5. Generate next week plan: apply 10% volume guideline, check phase transitions, apply override rules\n6. Update app and push to GitHub\n\nZone changes only happen after a field test, not from Garmin auto-detect. The plan is a guide, not a contract."},
  ];
  var h='';for(var i=0;i<secs.length;i++){h+='<div class="card"><div class="ct">'+secs[i].t+'</div><div style="font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap">'+secs[i].c+'</div></div>';}
  return h;
}

// ═══════════ RENDER ═══════════
function render(){
  var a=document.getElementById("app");
  var checks=getChecks();var totalSessions=0;for(var di=0;di<DAYS.length;di++)totalSessions+=DAYS[di].ids.length;var doneCount=0;for(var k in checks)if(checks[k])doneCount++;
  var h='<div class="header-row"><div class="header"><h1><span class="a">ENDURANCE</span><span class="b"> COACH</span></h1><span class="badge">by VERTERYN</span></div>';
  h+='<button class="refresh-btn" onclick="location.reload(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Refresh</button></div>';
  h+='<div class="sub m">Troms\u00f8 \u00b7 LTHR '+B.lthr+' \u00b7 VDOT ~'+B.vdot+' \u00b7 VO2max '+B.vo2max+' \u00b7 Updated 2026-05-11'+(doneCount>0?' \u00b7 <span style="color:var(--green)">'+doneCount+'/'+totalSessions+' done</span>':'')+'</div>';
  h+='<div class="tabs" id="tabs">';
  for(var i=0;i<TABS.length;i++)h+='<button class="tab'+(activeTab===i?' on':'')+'" data-i="'+i+'">'+TABS[i]+'</button>';
  h+='</div><div id="content">';
  if(activeTab===0)h+=renderThisWeek();
  else if(activeTab===1)h+=renderLastWeek();
  else if(activeTab===2)h+=renderProgress();
  else if(activeTab===3)h+=renderPlan();
  else if(activeTab===4)h+=renderProfile();
  else if(activeTab===5)h+=renderMethods();
  h+='</div><footer>Seiler polarized + Daniels VDOT + Friel zones + concurrent training research</footer>';
  a.innerHTML=h;
  var btns=document.querySelectorAll('.tab');
  for(var i=0;i<btns.length;i++){btns[i].addEventListener('click',function(){activeTab=parseInt(this.getAttribute('data-i'));render();window.scrollTo(0,0);});}
  if(activeTab===2)initCharts();
}

function initCharts(){
  var ctx=document.getElementById('volChart');if(!ctx)return;
  new Chart(ctx,{type:'bar',data:{labels:WK.map(function(w){return w.w}),datasets:[
    {label:'Run km',data:WK.map(function(w){return w.rKm}),backgroundColor:'rgba(239,68,68,0.8)',borderRadius:4,barPercentage:0.7},
    {label:'Endurance km',data:WK.map(function(w){return w.sKm||(w.cKm||0)}),backgroundColor:'rgba(59,130,246,0.45)',borderRadius:4,barPercentage:0.7}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11,family:'DM Sans'},padding:16}},tooltip:{backgroundColor:'#1e293b',titleColor:'#f1f5f9',bodyColor:'#94a3b8',borderColor:'#334155',borderWidth:1,cornerRadius:8,padding:10}},scales:{x:{ticks:{color:'#64748b',font:{size:10,family:'DM Sans'}},grid:{display:false}},y:{ticks:{color:'#64748b',font:{size:10},callback:function(v){return v+'km'}},grid:{color:'rgba(51,65,85,0.3)'}}}}});
}
render();
</script>
