function getChecks(){try{return JSON.parse(localStorage.getItem(checkKey))||{};}catch(e){return {};}}
function toggleCheck(id){var c=getChecks();if(c[id])delete c[id];else c[id]=1;localStorage.setItem(checkKey,JSON.stringify(c));render();}
function isChecked(id){return !!getChecks()[id];}
function chk(id){return '<div class="chk'+(isChecked(id)?' done':'')+'" onclick="toggleCheck(\''+id+'\')"></div>';}
function getDayCheckedCount(dayIdx){var d=DAYS[dayIdx];var c=getChecks();var n=0;for(var i=0;i<d.ids.length;i++){if(c[d.ids[i]])n++;}return n;}

  h+='<div class="prh"><span class="prl">~20–24 km/wk</span><span class="prv">3× runs</span></div><div class="prb"><div class="prf" style="width:80%"></div></div>';
  h+='</div>';

  h+='<div class="card"><div class="ct">Race Time Predictions</div>';
  h+='<p class="ctx">Garmin predictions (based on VO2max + recent training).</p>';
  h+='<table class="tbl"><thead><tr><th>Distance</th><th class="r">Actual Best</th><th class="r">Garmin Pred</th></tr></thead><tbody>';
  h+='<tr><td>5K</td><td class="r m" style="color:var(--text3)">26:26 (Mar 18)</td><td class="r m">23:13</td></tr>';
  h+='<tr><td>10K</td><td class="r m" style="color:var(--text3)">—</td><td class="r m">50:21</td></tr>';
  h+='<tr><td>Half</td><td class="r m" style="color:var(--text3)">—</td><td class="r m">1:55:19</td></tr>';
  h+='</tbody></table></div>';

  h+='<div class="card"><div class="ct">Milestones</div>';
  var ms=[
    {t:"Phase 1 complete ✓",s:"Week 2. Two weeks of 2-run structure. 73% easy split.",done:true},
    {t:"Ankle injury + plan pause",s:"Weeks 3–8. Six weeks unstructured.",done:true},
    {t:"Plan reset complete ✓",s:"Weeks 9–13. Both runs under 148, readiness 95.",done:true},
    {t:"Zone model switch ✓",s:"Week 14. Friel → Norwegian/Olympiatoppen. HRmax 190. Easy ceiling 156.",done:true},
    {t:"Threshold returns ✓",s:"Week 14. 3×5min at I-4 (HR 160–168). Body handled it well.",done:true},
    {t:"Consolidate new zones →",s:"Weeks 15–16. Same volume, monitor with Norwegian zones.",a:true},
    {t:"Add 3rd easy run (Sunday)",s:"After 2 weeks consolidated at current volume.",a:false},
    {t:"Retest 5K",s:"After 4+ weeks structured. Update VDOT.",a:false},
  ];
  for(var i=0;i<ms.length;i++){var mm=ms[i];
    var icon=mm.done?'✅':(mm.a?'→':'○');var col=mm.done?'var(--green)':(mm.a?'var(--blue)':'var(--text3)');
    h+='<div class="ms"><span class="mi" style="color:'+col+'">'+icon+'</span><div><div class="mt"'+(mm.done?' style="color:var(--green)"':'')+'>'+mm.t+'</div><div class="msub">'+mm.s+'</div></div></div>';}
  h+='</div>';
  return h;
}
// ═══════════ PROFILE ═══════════
function renderProfile(){
  var h='<div class="card"><div class="ct">Running Baseline (Updated Jul 12 — Live Garmin Data)</div><div class="stats">';
  var stats=[{l:"HRmax",v:B.maxHr+" bpm",s:"Garmin validated · zone anchor"},{l:"LTHR (auto)",v:B.lthr+" bpm",s:"Garmin Jul 9 · co-anchor"},{l:"Resting HR",v:B.restHr+" bpm",s:"Jul 12 · trending"},{l:"VO2max",v:""+B.vo2max,s:"Garmin estimate · Jul 9"},{l:"VDOT",v:"~"+B.vdot,s:"From 5K: 26:26"},{l:"Best 5K",v:B.best5k,s:"Mar 18 (PR)"},{l:"Easy Ceiling",v:"156 bpm",s:"Top of I-2 (82% HRmax)"},{l:"Threshold",v:"165–175",s:"I-4 (87–92% HRmax)"}];
  for(var i=0;i<stats.length;i++){var s=stats[i];h+='<div><div class="sl">'+s.l+'</div><div class="sv">'+s.v+'</div>';if(s.s)h+='<div class="ss">'+s.s+'</div>';h+='</div>';}
  h+='</div></div>';

  h+='<div class="card"><div class="ct">Norwegian/Olympiatoppen Zones (HRmax '+B.maxHr+')</div>';
  h+='<p style="font-size:10px;color:var(--text3);margin-bottom:8px">Running zones based on %HRmax. Sources: Olympiatoppen 2024 v2 (olt-skala.nif.no), Sandbakk et al. 2025 (Scientific Reports). I-1+I-2 = low-intensity domain below LT1. I-3 = moderate (LT1–LT2). I-4+ = high intensity above LT2.</p>';
  for(var i=0;i<B.zones.length;i++){var z=B.zones[i];h+='<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px"><span class="zd" style="background:'+z.c+'"></span><span style="color:var(--text2);flex:1">'+z.n+'</span><span class="m" style="color:var(--text3);margin-right:8px">'+z.pct+'</span><span class="m" style="color:var(--text)">'+(z.lo>0?z.lo:'<')+(z.lo>0?'–':'')+z.hi+' bpm</span></div>';}
  h+='</div>';

  h+='<div class="card"><div class="ct">Training Paces — HR-Governed</div>';
  h+='<p style="font-size:10px;color:var(--text3);margin-bottom:8px">HR always governs pace. Paces approximate — terrain, wind, heat affect pace at the same HR. In Tromsø conditions, expect slower paces at same HR.</p>';
  var pr=[{z:"Easy (I-1/I-2)",p:B.paces.I1+"–"+B.paces.I2.split("–")[1],hr:"<156 bpm",d:"Conversational. Most volume here."},{z:"Tempo (I-3)",p:B.paces.I3,hr:"156–165",d:"Moderate. LT1–LT2 zone. Not currently prescribed."},{z:"Threshold (I-4)",p:B.paces.I4,hr:"165–175",d:"Hard intervals. Above LT2. Current threshold target."},{z:"Max (I-5)",p:B.paces.I5,hr:"175–190",d:"Race pace / sprints. Not currently prescribed."}];
  for(var i=0;i<pr.length;i++){var r=pr[i];h+='<div class="pc"><div class="pcr"><span style="font-size:13px;font-weight:600;color:var(--text)">'+r.z+'</span><span class="m" style="font-size:13px;font-weight:700;color:var(--text)">'+r.p+'/km</span></div><div style="display:flex;justify-content:space-between;margin-top:2px"><span style="font-size:10px;color:var(--text3)">'+r.d+'</span><span class="m" style="font-size:10px;color:var(--blue)">'+r.hr+'</span></div></div>';}
  h+='<div class="hi">Zone model: Norwegian/Olympiatoppen (%HRmax) replaces Friel (%LTHR). Key change: easy ceiling rises from 148 to 156 bpm. The I-2 zone (137–156) is still physiologically below LT1 per Sandbakk et al. 2025. Garmin data is live — HRmax, LTHR, VO2max, and all recovery metrics update automatically.</div>';
  h+='</div>';
  return h;
}
// ═══════════ METHODS ═══════════
function renderMethods(){
  var secs=[
    {t:"Sources &amp; Framework",c:"This plan draws from multiple evidence-based systems:\n\n\u2022 Norwegian/Olympiatoppen zone model (2024 v2) — 8-zone intensity scale (I-1 through I-8) using %HRmax, lactate, RPE, and ventilation as co-anchors. For running, we use I-1 through I-5. Source: olt-skala.nif.no/olt_2024_en.pdf. Key principle: no single variable defines intensity — %HRmax is the primary practical anchor, cross-checked against RPE and breathing.\n\n\u2022 Sandbakk et al. 2025 (Scientific Reports) — 3-zone physiological model with LT1 and LT2 as the only two defensible boundaries. Maps to 5-zone scale: I-1+I-2 = low (below LT1), I-3 = moderate (LT1\u2013LT2), I-4+I-5 = high (above LT2). Verbatim: 'the low-intensity domain (Zone 1) is further divided into Zones 1 and 2.'\n\n\u2022 Nuuttila et al. 2025 (European J Applied Physiology) — n=165 recreational runners. At 80% HRmax, 57% moderate / 43% heavy domain. LT1 at ~80% HRmax, LT2 at ~90% HRmax on average. Error: 4.9\u20137.4 bpm at LT1.\n\n\u2022 Seiler polarized model (2010; St\u00f6ggl &amp; Sperlich 2014) — ~80/20 distribution by session count. Low = below LT1 (I-1+I-2), High = above LT2 (I-4+I-5). Evidence from 10\u201313 sessions/week; limited data at 2\u20133 runs/week.\n\n\u2022 Daniels Running Formula (4th ed.) — VDOT 36 from 5K: 26:26. Paces HR-calibrated.\n\n\u2022 Concurrent training — interference effect is limb-specific. Upper body: near-zero interference. Lower body: 48hrs from hard running."},
    {t:"Why HR Governs Pace",c:"All training paces are governed by HR zones, not pace targets. Zone anchoring has changed:\n\nOld system (Friel %LTHR, LTHR=174):\n\u2022 Easy (Z1) ceiling: 148 bpm (85% LTHR)\n\u2022 Threshold (Z4): 165\u2013172 bpm (95\u201399% LTHR)\n\nNew system (Norwegian %HRmax, HRmax=190):\n\u2022 Easy (I-2) ceiling: 156 bpm (82% HRmax)\n\u2022 Threshold (I-4): 165\u2013175 bpm (87\u201392% HRmax)\n\nKey impact: easy ceiling rises from 148 to 156. This is not a training intensity increase — it reflects a more accurate physiological placement of LT1. Per Nuuttila et al. 2025, LT1 sits at ~80% HRmax (152 bpm). The I-2 ceiling (156) is just above this, still physiologically in the low-intensity domain.\n\nRule: HR governs pace. In Troms\u00f8 conditions, expect paces 10\u201320s/km slower at same HR."},
    {t:"Garmin Metric Reliability",c:"All Garmin stats are now treated as live inputs. No more 'locked' values.\n\nReliable signals (measured during sleep):\n\u2022 HRV trend — stable or improving = good recovery\n\u2022 Resting HR trend — stable or decreasing = good adaptation\n\u2022 Readiness — composite of HRV, sleep, recovery time\n\nUseful live inputs (use with context):\n\u2022 VO2max — reacts to recent running quality. During threshold training: generally tracks fitness well\n\u2022 LTHR auto-detect — Garmin Jul 9: 171 bpm. Used as co-anchor alongside HRmax\n\u2022 Training Status — Productive = fitness trend positive. ACWR 1.3 = optimal load\n\u2022 Race Predictions — Garmin Jul 12: 5K 21:50, 10K 47:11, Half 1:48:35\n\nExpect: Stats move week to week with training load. Zone boundaries set by HRmax (static), not by fluctuating Garmin estimates."},
    {t:"How Training Load Is Tracked",c:"Running: weekly distance (km) + time distribution (easy vs threshold) + HR zone breakdown per run.\nStrength: session count and consistency.\nHiking/endurance: duration + average HR zone.\nWalks/yoga: not tracked as training load.\n\nFatigue decisions use Garmin Training Readiness + sleep quality + HRV status as primary signals.\n\nNote: Training Readiness and HRV are the most reliable Garmin fatigue signals because they are measured during sleep, not during exercise."},
    {t:"Concurrent Training Scheduling",c:"The interference effect is limb-specific (post-Hickson research). Practical application:\n\n\u2022 Arms, chest, core \u2192 near-zero interference with running. No scheduling constraint.\n\u2022 Legs (deadlift, squat) \u2192 48hrs from hard running (standard coaching practice).\n\nAt current running volume (~2\u00d7/week, ~15km), interference is minimal.\n\nSchedule: Tue legs \u2192 Wed easy run (post-legs, HR governs) \u2192 Thu strength (upper) \u2192 Mon threshold (fresh legs after Fri rest)."},
    {t:"Weekly Update Process",c:"Each week: say \"update\". Then:\n\n1. Pull all Garmin data (activities, LTHR, VO2max, training status, readiness, HRV, resting HR, race predictions) + Strava cross-reference\n2. Process: filter to current week, extract stats per activity\n3. Compare actual vs planned day-by-day, deep dive on running + endurance\n4. Report Garmin stats as live inputs — all values current\n5. Generate next week plan: apply zone model, check phase transitions\n6. Update app and push to GitHub\n\nZone model: Norwegian/Olympiatoppen (%HRmax). HRmax 190 is the anchor. The plan is a guide, not a contract."},
  ];
  var h='';for(var i=0;i<secs.length;i++){h+='<div class="card"><div class="ct">'+secs[i].t+'</div><div style="font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap">'+secs[i].c+'</div></div>';}
  return h;
}
// ═══════════ RENDER ═══════════
function render(){
  var a=document.getElementById("app");
  var checks=getChecks();var totalSessions=0;for(var di=0;di<DAYS.length;di++)totalSessions+=DAYS[di].ids.length;var doneCount=0;for(var k in checks)if(checks[k])doneCount++;
  var h='<div class="header-row"><div class="header"><h1><span class="a">ENDURANCE</span><span class="b"> COACH</span></h1><span class="badge">by VERTERYN</span></div>';
  h+='<button class="refresh-btn" onclick="location.reload(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Refresh</button></div>';
  h+='<div class="sub m">Troms\u00f8 \u00b7 HRmax '+B.maxHr+' \u00b7 Norwegian zones \u00b7 VO2max '+B.vo2max+' \u00b7 Updated 2026-07-13'+(doneCount>0?' \u00b7 <span style="color:var(--green)">'+doneCount+'/'+totalSessions+' done</span>':'')+'</div>';
  h+='<div class="tabs" id="tabs">';
  for(var i=0;i<TABS.length;i++)h+='<button class="tab'+(activeTab===i?' on':'')+'" data-i="'+i+'">'+TABS[i]+'</button>';
  h+='</div><div id="content">';
  if(activeTab===0)h+=renderThisWeek();
  else if(activeTab===1)h+=renderLastWeek();
  else if(activeTab===2)h+=renderProgress();
  else if(activeTab===3)h+=renderPlan();
  else if(activeTab===4)h+=renderProfile();
  else if(activeTab===5)h+=renderMethods();
  h+='</div><footer>Norwegian/Olympiatoppen zones + Seiler polarized + Daniels VDOT + Sandbakk 2025</footer>';
  a.innerHTML=h;
  var btns=document.querySelectorAll('.tab');
  for(var i=0;i<btns.length;i++){btns[i].addEventListener('click',function(){activeTab=parseInt(this.getAttribute('data-i'));render();window.scrollTo(0,0);});}
  if(activeTab===2)initCharts();
}

function initCharts(){
  var ctx=document.getElementById('volChart');if(!ctx)return;
  new Chart(ctx,{type:'bar',data:{labels:WK.map(function(w){return w.w}),datasets:[
    {label:'Run km',data:WK.map(function(w){return w.rKm}),backgroundColor:'rgba(239,68,68,0.8)',borderRadius:4,barPercentage:0.7},
    {label:'Endurance km',data:WK.map(function(w){return (w.sKm||0)+(w.cKm||0)+(w.hKm||0)}),backgroundColor:'rgba(59,130,246,0.45)',borderRadius:4,barPercentage:0.7}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11,family:'DM Sans'},padding:16}},tooltip:{backgroundColor:'#1e293b',titleColor:'#f1f5f9',bodyColor:'#94a3b8',borderColor:'#334155',borderWidth:1,cornerRadius:8,padding:10}},scales:{x:{ticks:{color:'#64748b',font:{size:10,family:'DM Sans'}},grid:{display:false}},y:{ticks:{color:'#64748b',font:{size:10},callback:function(v){return v+'km'}},grid:{color:'rgba(51,65,85,0.3)'}}}}});
}
render();
</script>
